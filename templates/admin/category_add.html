{% extends 'base/admin/base.html' %}

{% block header %}{% endblock %}

{% block content %}
<form class="space-y-6" action="#" method="POST" enctype="multipart/form-data">
	<div class="bg-white px-4 py-5 shadow sm:rounded-lg sm:p-6">
		<div class="md:grid md:grid-cols-6 md:gap-6">

			<div class="md:col-span-1">
				<h3 class="text-lg font-medium leading-6 text-gray-900">مشخصات دسته‌بندی</h3>
			</div>

			<div class="mt-5 col-span-5">

				<div class="grid grid-cols-6 gap-6 mt-5">

					<div class="col-span-6 sm:col-span-3">
						<label class="block text-sm font-medium text-gray-700">نام</label>
						<input name="name" type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue focus:ring-blue sm:text-sm" value="">
					</div>

					<div class="col-span-6 sm:col-span-3">
						<label class="block text-sm font-medium text-gray-700">نام انگلیسی</label>
						<input name="original-name" type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue focus:ring-blue sm:text-sm" value="">
					</div>

					<div class="col-span-6">
						<label class="block text-sm font-medium text-gray-700">توضیحات</label>
						<textarea name="description" row="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue focus:ring-blue sm:text-sm"></textarea>
					</div>

					<div class="col-span-6">
						<label class="block text-sm font-medium text-gray-700">آیکون</label>
						<textarea name="icon" row="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue focus:ring-blue sm:text-sm"></textarea>
					</div>

				</div>
			</div>

		</div>
	</div>

	<div class="flex justify-end">
		<button type="button" class="rounded-md border border-gray-300 bg-white py-2 px-4 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue focus:ring-offset-2" onclick="javascript:window.history.back();">لغو</button>
		<button type="submit" class="mx-3 inline-flex justify-center rounded-md border border-transparent bg-midnight py-2 px-4 text-sm font-medium text-white shadow-sm focus:outline-none focus:ring-2 focus:ring-blue focus:ring-offset-2">ذخیره</button>
	</div>
</form>

{% endblock %}
