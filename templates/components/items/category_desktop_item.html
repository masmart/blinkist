{% if staggered %}
<a data-test-id="b-chip" href="/category/{{ item.slug }}" class="font-cera-pro text-midnight flex w-max items-center py-3 border-2 border-solid rounded px-4 cursor-pointer m:hover:border-green border-white bg-pale-mint-grey">
    <svg fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class=" w-6 h-6 ml-2 text-midnight flex-shrink-0">
        {{ item.icon|safe }}
    </svg>
    <span class="block whitespace-nowrap">{{ item.name }}</span>
</a>
{% else %}
<a href="/category/{{ item.slug }}" class="w-full bg-pale-mint-grey text-midnight text-h4 rounded m:h-18 l:h-auto p-4 font-bold flex m:items-center m:justify-center m:py-3 m:px-1 m:text-base m:font-normal hover:border-green border-2 border-transparent">
    <svg fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 ml-2 flex-shrink-0">
        {{ item.icon|safe }}
    </svg>
    <span class="w-min hidden m:block l:hidden">{{ item.name }}</span>
    <span class="m:hidden l:block">{{ item.name }}</span>
</a>
{% endif %}
