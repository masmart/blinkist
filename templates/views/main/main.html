<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کتابچ</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/dist/output.css') }}">
</head>

<body>
    <header class="relative">
        <div class="mx-auto my-auto">
            <div class="flex justify-between items-center py-7 mx-52">
                <img src="{{ url_for('static', filename='images/logo.png') }}" class="w-12 h-12">
                <div>
                    <a href="{{ url_for('user_bp.login_view') }}" class="text-secondary p-2 hover:border-b-4 border-primary">ورود</a>
                    <a href="{{ url_for('user_bp.register_view') }}" class="text-secondary p-2 hover:border-b-4 border-primary">ثبت‌نام</a>
                </div>
            </div>
        </div>
        <div class="relative">
            <div class="absolute right-0 top-0 h-screen w-1/4 bg-blue-600" style="background-color:#2367E9;"></div>
            <svg class="absolute right-0 top-0 h-screen w-1/4">
                <path d="M788 -169.798C788 -169.798 351.082 -200.204 272.5 60C174.5 384.5 0 288 0 456H788V-169.798Z" fill="#0365F2"/>
            </svg>
            <img class="mx-auto my-20 h-64" src="{{ url_for('static', filename='images/phones.png') }}" alt="phone image">
            <div class="text-center">
              <h1 class="text-3xl font-medium">Title</h1>
              <p class="text-xl">Description</p>
            </div>
          </div>
        <div class="relative flex">
            <div class="w-2/3 ml-4">
                <h1 class="text-2xl">Big Title</h1>
                <p class="text-sm">Smaller Paragraph</p>
                <button class="bg-blue-500 text-white py-2 px-4 rounded-full">Button</button>
            </div>
            <svg class="w-5/6 top-0 right-0" width="439" height="454" viewBox="0 0 439 454" fill="#0365F2" xmlns="http://www.w3.org/2000/svg">
                <path d="M788 -169.798C788 -169.798 351.082 -200.204 272.5 60C174.5 384.5 0 288 0 456H788V-169.798Z" fill="#0365F2"/>
            </svg>
            <img src="{{ url_for('static', filename='images/phones.png') }}" class="absolute top-0 right-0 w-1/3">
        </div>

    </header>
</body>

</html>
